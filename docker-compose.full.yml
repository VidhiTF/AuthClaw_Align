services:
  postgres:
    image: postgres:17
    container_name: authclaw-full-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-authclaw}
      POSTGRES_USER: ${POSTGRES_USER:-authclaw}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-authclaw}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - full_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-authclaw} -d ${POSTGRES_DB:-authclaw}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: authclaw-full-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  opa:
    image: openpolicyagent/opa@sha256:dc009236137bb225a1ef09293bb32f2ee1861cc428870d297bf71412d50221c3
    container_name: authclaw-full-opa
    command:
      - "run"
      - "--server"
      - "--addr=0.0.0.0:8181"
      - "/policies"
    volumes:
      - ./infra/opa:/policies:ro

  presidio:
    image: mcr.microsoft.com/presidio-analyzer@sha256:286e3fa7f3a7426e775e8564fe1870f1ba8f999d3ab8bbb8cc46a44355d9d6e9
    container_name: authclaw-full-presidio
    ports:
      - "${PRESIDIO_PORT:-3000}:3000"

  mock-provider:
    image: python:3.14.3-slim
    container_name: authclaw-full-mock-provider
    profiles: ["ci"]
    working_dir: /app
    command: ["python", "/app/scripts/mock_llm_provider.py", "--host", "0.0.0.0", "--port", "19090"]
    volumes:
      - ./scripts/mock_llm_provider.py:/app/scripts/mock_llm_provider.py:ro
    ports:
      - "${MOCK_PROVIDER_PORT:-19090}:19090"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:19090/health', timeout=2).read()\""]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: docker.redpanda.com/redpandadata/redpanda:v23.2.19
    container_name: authclaw-full-kafka
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=1G
      - --default-log-level=info
      - --kafka-addr=INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      - --advertise-kafka-addr=INTERNAL://kafka:29092,EXTERNAL://localhost:9092
    ports:
      - "${KAFKA_PORT:-9092}:9092"

  kafka-init:
    image: docker.redpanda.com/redpandadata/redpanda:v23.2.19
    container_name: authclaw-full-kafka-init
    depends_on:
      - kafka
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        until rpk cluster info -X brokers=kafka:29092 >/dev/null 2>&1; do sleep 1; done;
        rpk topic create gateway.traffic --partitions 12 --replicas 1 --topic-config retention.ms=604800000 --topic-config cleanup.policy=delete -X brokers=kafka:29092 || true;
        rpk topic create audit.events --partitions 12 --replicas 1 --topic-config retention.ms=2592000000 --topic-config cleanup.policy=delete -X brokers=kafka:29092 || true;
        rpk topic create audit.deadletter --partitions 6 --replicas 1 --topic-config retention.ms=7776000000 --topic-config cleanup.policy=delete -X brokers=kafka:29092 || true;
        rpk topic list -X brokers=kafka:29092;

  clickhouse:
    image: clickhouse/clickhouse-server@sha256:07afc18d8a9706eb9d85c5c5d2752e5270f91bbc2894caeaecb73e4d0f603bf5
    container_name: authclaw-full-clickhouse
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-authclaw}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-authclaw}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-authclaw}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    volumes:
      - full_clickhouse_data:/var/lib/clickhouse
      - ./infra/clickhouse:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  clickhouse-schema:
    image: clickhouse/clickhouse-server@sha256:07afc18d8a9706eb9d85c5c5d2752e5270f91bbc2894caeaecb73e4d0f603bf5
    container_name: authclaw-full-clickhouse-schema
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_NATIVE_PORT: "9000"
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-authclaw}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-authclaw}
    volumes:
      - ./infra/clickhouse:/schema:ro
    entrypoint: ["/bin/bash", "/schema/migrate.sh"]
    restart: "no"

  database-bootstrap:
    image: authclaw_monorepo-backend:latest
    container_name: authclaw-full-database-bootstrap
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BOOTSTRAP_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-authclaw}:${POSTGRES_PASSWORD:-authclaw}@postgres:5432/${POSTGRES_DB:-authclaw}
      POSTGRES_DB: ${POSTGRES_DB:-authclaw}
      BACKEND_MIGRATOR_USER: ${BACKEND_MIGRATOR_USER:-authclaw_migrator}
      BACKEND_MIGRATOR_PASSWORD: ${BACKEND_MIGRATOR_PASSWORD:-authclaw_migrator}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-authclaw_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-authclaw_app}
      AGENT_MIGRATOR_USER: ${AGENT_MIGRATOR_USER:-authclaw_agent_migrator}
      AGENT_MIGRATOR_PASSWORD: ${AGENT_MIGRATOR_PASSWORD:-authclaw_agent_migrator}
      AGENT_RUNTIME_USER: ${AGENT_RUNTIME_USER:-authclaw_agent_runtime}
      AGENT_RUNTIME_PASSWORD: ${AGENT_RUNTIME_PASSWORD:-authclaw_agent_runtime}
    command: ["python", "scripts/bootstrap_database_security.py", "prepare"]
    restart: "no"

  backend-migrations:
    image: authclaw_monorepo-backend:latest
    container_name: authclaw-full-backend-migrations
    depends_on:
      database-bootstrap:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+psycopg://${BACKEND_MIGRATOR_USER:-authclaw_migrator}:${BACKEND_MIGRATOR_PASSWORD:-authclaw_migrator}@postgres:5432/${POSTGRES_DB:-authclaw}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-authclaw_app}
      ENVELOPE_KEY: ${ENVELOPE_KEY:-YXV0aGNsYXctbG9jYWwtZmVybmV0LWtleS1jaGFuZ2U=}
      API_KEY_HASH_SECRET: ${API_KEY_HASH_SECRET:-authclaw-full-local-api-key-hash-secret}
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  database-grants:
    image: authclaw_monorepo-backend:latest
    container_name: authclaw-full-database-grants
    depends_on:
      backend-migrations:
        condition: service_completed_successfully
      agent-migrations:
        condition: service_completed_successfully
    environment:
      BOOTSTRAP_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-authclaw}:${POSTGRES_PASSWORD:-authclaw}@postgres:5432/${POSTGRES_DB:-authclaw}
      POSTGRES_DB: ${POSTGRES_DB:-authclaw}
      BACKEND_MIGRATOR_USER: ${BACKEND_MIGRATOR_USER:-authclaw_migrator}
      BACKEND_MIGRATOR_PASSWORD: ${BACKEND_MIGRATOR_PASSWORD:-authclaw_migrator}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-authclaw_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-authclaw_app}
      AGENT_MIGRATOR_USER: ${AGENT_MIGRATOR_USER:-authclaw_agent_migrator}
      AGENT_MIGRATOR_PASSWORD: ${AGENT_MIGRATOR_PASSWORD:-authclaw_agent_migrator}
      AGENT_RUNTIME_USER: ${AGENT_RUNTIME_USER:-authclaw_agent_runtime}
      AGENT_RUNTIME_PASSWORD: ${AGENT_RUNTIME_PASSWORD:-authclaw_agent_runtime}
    command: ["python", "scripts/bootstrap_database_security.py", "finalize"]
    restart: "no"

  database-security-check:
    image: authclaw_monorepo-backend:latest
    container_name: authclaw-full-database-security-check
    depends_on:
      database-grants:
        condition: service_completed_successfully
    environment:
      BOOTSTRAP_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-authclaw}:${POSTGRES_PASSWORD:-authclaw}@postgres:5432/${POSTGRES_DB:-authclaw}
      BACKEND_DATABASE_URL: postgresql+psycopg://${POSTGRES_APP_USER:-authclaw_app}:${POSTGRES_APP_PASSWORD:-authclaw_app}@postgres:5432/${POSTGRES_DB:-authclaw}
      AGENT_DATABASE_URL: postgresql+psycopg://${AGENT_RUNTIME_USER:-authclaw_agent_runtime}:${AGENT_RUNTIME_PASSWORD:-authclaw_agent_runtime}@postgres:5432/${POSTGRES_DB:-authclaw}
      BACKEND_MIGRATOR_USER: ${BACKEND_MIGRATOR_USER:-authclaw_migrator}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-authclaw_app}
      AGENT_MIGRATOR_USER: ${AGENT_MIGRATOR_USER:-authclaw_agent_migrator}
      AGENT_RUNTIME_USER: ${AGENT_RUNTIME_USER:-authclaw_agent_runtime}
      AGENT_RLS_CONTEXT_SECRET: ${AGENT_RLS_CONTEXT_SECRET:-authclaw-full-agent-rls-context-secret-change-me}
      AUTHCLAW_ENCRYPTION_KEY: ${AUTHCLAW_ENCRYPTION_KEY:-${AGENT_ENCRYPTION_KEY:-YXV0aGNsYXctYWdlbnQtbG9jYWwtZmVybmV0LWtleSE=}}
    command: ["python", "scripts/verify_database_security.py"]
    restart: "no"
  demo-seed:
    profiles: ["demo-seed"]
    image: authclaw_monorepo-backend:latest
    container_name: authclaw-full-demo-seed
    depends_on:
      database-security-check:
        condition: service_completed_successfully
    environment:
      DEMO_SEED_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-authclaw}:${POSTGRES_PASSWORD:-authclaw}@postgres:5432/${POSTGRES_DB:-authclaw}
      AUTHCLAW_ENV: ${AUTHCLAW_ENV:-local}
      ENVELOPE_KEY: ${ENVELOPE_KEY:-YXV0aGNsYXctbG9jYWwtZmVybmV0LWtleS1jaGFuZ2U=}
      API_KEY_HASH_SECRET: ${API_KEY_HASH_SECRET:-authclaw-full-local-api-key-hash-secret}
      AUTHCLAW_LITE_DEMO_PASSWORD: ${AUTHCLAW_LITE_DEMO_PASSWORD:-AuthClawDemo!234}
    command: ["python", "scripts/seed_authclaw_lite.py"]
    restart: "no"

  backend:
    image: authclaw_monorepo-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile.demo
    container_name: authclaw-full-backend
    env_file:
      - path: .env.local
        required: false
    depends_on:
      database-security-check:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      opa:
        condition: service_started
      presidio:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
      clickhouse-schema:
        condition: service_completed_successfully
    environment:
      OWNER_DATABASE_URL: null
      BOOTSTRAP_DATABASE_URL: null
      MIGRATION_DATABASE_URL: null
      BACKEND_MIGRATION_DATABASE_URL: null
      AGENT_MIGRATION_DATABASE_URL: null
      POSTGRES_USER: null
      POSTGRES_PASSWORD: null
      BACKEND_MIGRATOR_USER: null
      BACKEND_MIGRATOR_PASSWORD: null
      AGENT_MIGRATOR_USER: null
      AGENT_MIGRATOR_PASSWORD: null
      AGENT_RUNTIME_USER: null
      AGENT_RUNTIME_PASSWORD: null
      AGENT_POSTGRES_USER: null
      AGENT_POSTGRES_PASSWORD: null
      AGENT_POSTGRES_DB: null
      APP_DATABASE_URL: postgresql+psycopg://${POSTGRES_APP_USER:-authclaw_app}:${POSTGRES_APP_PASSWORD:-authclaw_app}@postgres:5432/${POSTGRES_DB:-authclaw}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_APP_USER:-authclaw_app}:${POSTGRES_APP_PASSWORD:-authclaw_app}@postgres:5432/${POSTGRES_DB:-authclaw}
      AUTHCLAW_RUNTIME_DB_ROLE: ${POSTGRES_APP_USER:-authclaw_app}
      REDIS_URL: redis://redis:6379
      OPA_URL: http://opa:8181
      PRESIDIO_URL: http://presidio:3000
      PRESIDIO_ANALYZE_TIMEOUT_MS: ${PRESIDIO_ANALYZE_TIMEOUT_MS:-750}
      REDACTION_LOCAL_ANALYZER_ONLY: ${REDACTION_LOCAL_ANALYZER_ONLY:-false}
      KAFKA_BROKERS: kafka:29092
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-authclaw}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-authclaw}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-authclaw}
      API_DEBUG: ${API_DEBUG:-false}
      OIDC_BFF_EXCHANGE_SECRET: ${OIDC_BFF_EXCHANGE_SECRET:-}
      AWS_ENABLED: ${AWS_ENABLED:-false}
      BEDROCK_ENABLED: ${BEDROCK_ENABLED:-false}
      AWS_SECRETS_MANAGER_ENABLED: ${AWS_SECRETS_MANAGER_ENABLED:-false}
      AUTHCLAW_ENV: ${AUTHCLAW_ENV:-local}
      JWT_SECRET: ${JWT_SECRET:-authclaw-full-local-jwt-secret-change-me}
      SESSION_SECRET: ${SESSION_SECRET:-authclaw-full-local-session-secret}
      SESSION_SECRET_V1: ${SESSION_SECRET_V1:-authclaw-full-local-session-secret}
      SESSION_SECRET_V2: ${SESSION_SECRET_V2:-authclaw-full-local-session-secret-v2}
      AUTHCLAW_SESSION_KEY_VERSION: ${AUTHCLAW_SESSION_KEY_VERSION:-v1}
      API_KEY_HASH_SECRET: ${API_KEY_HASH_SECRET:-authclaw-full-local-api-key-hash-secret}
      ENVELOPE_KEY: ${ENVELOPE_KEY:-YXV0aGNsYXctbG9jYWwtZmVybmV0LWtleS1jaGFuZ2U=}
      KMS_KEY_ID: ${KMS_KEY_ID:-full-local-key}
      DEMO_OTP_VISIBLE: ${DEMO_OTP_VISIBLE:-false}
      AUTHCLAW_EMAIL_OUTBOX_PATH: ${AUTHCLAW_EMAIL_OUTBOX_PATH:-/app/.authclaw/email-outbox.jsonl}
      AUTHCLAW_LITE_DEMO_PASSWORD: ${AUTHCLAW_LITE_DEMO_PASSWORD:-AuthClawDemo!234}
      AUTHCLAW_LITE_DEMO_TOTP_SECRET: ${AUTHCLAW_LITE_DEMO_TOTP_SECRET:-}
      OIDC_TENANT_CLAIM: ${OIDC_TENANT_CLAIM:-tenant_id}
      OIDC_TENANT_CLAIM_VALUE: ${OIDC_TENANT_CLAIM_VALUE:-}
      AUTHCLAW_OIDC_TENANT_MAPPINGS: ${AUTHCLAW_OIDC_TENANT_MAPPINGS:-{}}
      OIDC_REQUIRE_MFA: ${OIDC_REQUIRE_MFA:-true}
      OIDC_ACCEPTED_AMR: ${OIDC_ACCEPTED_AMR:-mfa}
      OIDC_ACCEPTED_ACR: ${OIDC_ACCEPTED_ACR:-}
      OIDC_MAX_AUTH_AGE_SECONDS: ${OIDC_MAX_AUTH_AGE_SECONDS:-43200}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      SMTP_TLS: ${SMTP_TLS:-true}
      NEXT_PUBLIC_AUTHCLAW_DEMO_MODE: "false"
      PUBLIC_GATEWAY_URL: ${PUBLIC_GATEWAY_URL:-http://localhost:8080}
      ONBOARDING_SIGNUP_EMAIL_PER_HOUR: ${ONBOARDING_SIGNUP_EMAIL_PER_HOUR:-20}
      ONBOARDING_SIGNUP_IP_PER_DAY: ${ONBOARDING_SIGNUP_IP_PER_DAY:-100}
      ONBOARDING_VERIFY_IP_PER_HOUR: ${ONBOARDING_VERIFY_IP_PER_HOUR:-100}
      LOGIN_ACCOUNT_ATTEMPTS_PER_15_MINUTES: ${LOGIN_ACCOUNT_ATTEMPTS_PER_15_MINUTES:-10}
      LOGIN_IP_ATTEMPTS_PER_MINUTE: ${LOGIN_IP_ATTEMPTS_PER_MINUTE:-60}
      GATEWAY_RATE_LIMIT_ENABLED: ${GATEWAY_RATE_LIMIT_ENABLED:-true}
      GATEWAY_RATE_LIMIT_PER_MINUTE: ${GATEWAY_RATE_LIMIT_PER_MINUTE:-120}
      GATEWAY_RATE_LIMIT_BURST_10S: ${GATEWAY_RATE_LIMIT_BURST_10S:-30}
      GATEWAY_RATE_LIMIT_DAILY: ${GATEWAY_RATE_LIMIT_DAILY:-10000}
      GATEWAY_MAX_BODY_BYTES: ${GATEWAY_MAX_BODY_BYTES:-1048576}
      GATEWAY_MAX_DAILY_SPEND_USD: ${GATEWAY_MAX_DAILY_SPEND_USD:-25}
      GATEWAY_ESTIMATED_COST_PER_1K_REQUESTS_USD: ${GATEWAY_ESTIMATED_COST_PER_1K_REQUESTS_USD:-1}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    command: ["python", "-m", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--no-proxy-headers"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()\""]
      interval: 10s
      timeout: 5s
      retries: 10

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile.demo
    container_name: authclaw-full-gateway
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
      opa:
        condition: service_started
      presidio:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
    environment:
      PORT: "8080"
      DATABASE_URL: postgresql://${POSTGRES_APP_USER:-authclaw_app}:${POSTGRES_APP_PASSWORD:-authclaw_app}@postgres:5432/${POSTGRES_DB:-authclaw}?sslmode=disable
      REDIS_URL: redis://redis:6379
      OPA_URL: http://opa:8181
      OPA_TIMEOUT_MS: ${OPA_TIMEOUT_MS:-5000}
      PRESIDIO_URL: http://presidio:3000
      PRESIDIO_ANALYZE_TIMEOUT_MS: ${PRESIDIO_ANALYZE_TIMEOUT_MS:-750}
      REDACTION_LOCAL_ANALYZER_ONLY: ${REDACTION_LOCAL_ANALYZER_ONLY:-false}
      REDACTION_RUNTIME_CONFIG_CACHE_TTL_MS: ${REDACTION_RUNTIME_CONFIG_CACHE_TTL_MS:-0}
      REDACTION_HASH_SALT: ${REDACTION_HASH_SALT:-authclaw_redaction_salt_v1}
      KAFKA_BROKERS: kafka:29092
      ENVELOPE_KEY: ${ENVELOPE_KEY:-YXV0aGNsYXctbG9jYWwtZmVybmV0LWtleS1jaGFuZ2U=}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.anthropic.com}
      COHERE_BASE_URL: ${COHERE_BASE_URL:-https://api.cohere.ai}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com}
      AZURE_OPENAI_BASE_URL: ${AZURE_OPENAI_BASE_URL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AWS_ENABLED: ${AWS_ENABLED:-false}
      BEDROCK_ENABLED: ${BEDROCK_ENABLED:-false}
      AUTHCLAW_ENV: ${AUTHCLAW_ENV:-local}
      JWT_SECRET: ${JWT_SECRET:-authclaw-full-local-jwt-secret-change-me}
      SESSION_SECRET: ${SESSION_SECRET:-authclaw-full-local-session-secret}
      SESSION_SECRET_V1: ${SESSION_SECRET_V1:-authclaw-full-local-session-secret}
      API_KEY_HASH_SECRET: ${API_KEY_HASH_SECRET:-authclaw-full-local-api-key-hash-secret}
      GATEWAY_HTTP_LOGGER_ENABLED: ${GATEWAY_HTTP_LOGGER_ENABLED:-true}
      GATEWAY_AUTH_LAST_USED_ENABLED: ${GATEWAY_AUTH_LAST_USED_ENABLED:-true}
      GATEWAY_AUTH_CACHE_TTL_MS: ${GATEWAY_AUTH_CACHE_TTL_MS:-0}
      PROVIDER_CREDENTIAL_CACHE_TTL_MS: ${PROVIDER_CREDENTIAL_CACHE_TTL_MS:-0}
      GATEWAY_POLICY_LOCAL_FAST_PATH: ${GATEWAY_POLICY_LOCAL_FAST_PATH:-false}
      GATEWAY_POLICY_DECISION_CACHE_TTL_MS: ${GATEWAY_POLICY_DECISION_CACHE_TTL_MS:-0}
      AUDIT_FAIL_CLOSED: ${AUDIT_FAIL_CLOSED:-false}
      AUDIT_OUTBOX_PATH: /var/lib/authclaw-gateway/audit-outbox.ndjson
      GATEWAY_RATE_LIMIT_ENABLED: ${GATEWAY_RATE_LIMIT_ENABLED:-true}
      GATEWAY_RATE_LIMIT_PER_MINUTE: ${GATEWAY_RATE_LIMIT_PER_MINUTE:-120}
      GATEWAY_RATE_LIMIT_BURST_10S: ${GATEWAY_RATE_LIMIT_BURST_10S:-30}
      GATEWAY_RATE_LIMIT_DAILY: ${GATEWAY_RATE_LIMIT_DAILY:-10000}
      GATEWAY_MAX_BODY_BYTES: ${GATEWAY_MAX_BODY_BYTES:-1048576}
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    volumes:
      - full_gateway_audit_outbox:/var/lib/authclaw-gateway

  agent-migrations:
    image: authclaw_monorepo-agent:latest
    container_name: authclaw-full-agent-migrations
    depends_on:
      backend-migrations:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${AGENT_MIGRATOR_USER:-authclaw_agent_migrator}:${AGENT_MIGRATOR_PASSWORD:-authclaw_agent_migrator}@postgres:5432/${POSTGRES_DB:-authclaw}
      MIGRATION_DATABASE_URL: postgresql://${AGENT_MIGRATOR_USER:-authclaw_agent_migrator}:${AGENT_MIGRATOR_PASSWORD:-authclaw_agent_migrator}@postgres:5432/${POSTGRES_DB:-authclaw}
      AUTHCLAW_DATABASE_SCHEMA: ${AGENT_DATABASE_SCHEMA:-agent}
      AGENT_RLS_CONTEXT_SECRET: ${AGENT_RLS_CONTEXT_SECRET:-authclaw-full-agent-rls-context-secret-change-me}
      AUTHCLAW_ENCRYPTION_KEY: ${AUTHCLAW_ENCRYPTION_KEY:-${AGENT_ENCRYPTION_KEY:-YXV0aGNsYXctYWdlbnQtbG9jYWwtZmVybmV0LWtleSE=}}
      AUTHCLAW_ENV: ${AUTHCLAW_ENV:-local}
    command: ["python", "-m", "database.migrations"]
    restart: "no"
  agent:
    image: authclaw_monorepo-agent:latest
    build:
      context: ./services/agent
    container_name: authclaw-full-agent
    depends_on:
      database-security-check:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      opa:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://${AGENT_RUNTIME_USER:-authclaw_agent_runtime}:${AGENT_RUNTIME_PASSWORD:-authclaw_agent_runtime}@postgres:5432/${POSTGRES_DB:-authclaw}
      AUTHCLAW_DATABASE_SCHEMA: ${AGENT_DATABASE_SCHEMA:-agent}
      AGENT_RLS_CONTEXT_SECRET: ${AGENT_RLS_CONTEXT_SECRET:-authclaw-full-agent-rls-context-secret-change-me}
      AUTHCLAW_ENCRYPTION_KEY: ${AUTHCLAW_ENCRYPTION_KEY:-${AGENT_ENCRYPTION_KEY:-YXV0aGNsYXctYWdlbnQtbG9jYWwtZmVybmV0LWtleSE=}}
      AUTHCLAW_RUNTIME_DB_ROLE: ${AGENT_RUNTIME_USER:-authclaw_agent_runtime}
      REDIS_URL: redis://redis:6379
      AUTHCLAW_ENV: ${AUTHCLAW_ENV:-local}
      AUTHCLAW_ALLOWED_ORIGINS: http://localhost:3001
      AUTHCLAW_DISABLE_BACKGROUND_MONITOR: ${AUTHCLAW_DISABLE_BACKGROUND_MONITOR:-true}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-gemini}
      MODEL_NAME: ${MODEL_NAME:-gemini-2.5-flash-lite}
      GOOGLE_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_API_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com}
      AUTHCLAW_PROVIDER_GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AUTHCLAW_PROVIDER_GEMINI_API_BASE: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com}
      AUTHCLAW_PROVIDER_GEMINI_MODEL: ${MODEL_NAME:-gemini-2.5-flash-lite}
      AUTHCLAW_GO_GATEWAY_URL: http://gateway:8080
      JWT_SECRET: ${AGENT_JWT_SECRET:-authclaw-full-agent-jwt-secret-change-me}
      JWT_SECRET_V1: ${AGENT_JWT_SECRET_V1:-authclaw-full-agent-jwt-secret-change-me}
      JWT_SECRET_V2: ${AGENT_JWT_SECRET_V2:-authclaw-full-agent-jwt-secret-v2-change-me}
      AUTHCLAW_JWT_KEY_VERSION: ${AUTHCLAW_JWT_KEY_VERSION:-v1}
      AUTHCLAW_REDACTION_SALT: ${AGENT_REDACTION_SALT:-authclaw-full-agent-redaction-salt-change-me}
      AUTHCLAW_OPA_POLICY_URL: http://opa:8181/v1/data/authclaw/policy/decision
      AUTHCLAW_INTERNAL_SERVICE_SECRET: ${AUTHCLAW_INTERNAL_SERVICE_SECRET:-authclaw-full-internal-service-secret-change-me}
    ports:
      - "127.0.0.1:${AGENT_PORT:-8001}:8001"

  audit_consumer:
    build:
      context: .
      dockerfile: audit_consumer/Dockerfile
    container_name: authclaw-full-audit-consumer
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      clickhouse-schema:
        condition: service_completed_successfully
    environment:
      KAFKA_BROKERS: kafka:29092
      KAFKA_TOPICS: gateway.traffic,audit.events
      KAFKA_DLQ_TOPIC: audit.deadletter
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-authclaw}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-authclaw}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-authclaw}
      AUDIT_CONSUMER_METRICS_PORT: "9108"
      AUDIT_CONSUMER_METRICS_HOST: "0.0.0.0"
    ports:
      - "127.0.0.1:${AUDIT_CONSUMER_METRICS_PORT:-9108}:9108"
    restart: on-failure

  console:
    build:
      context: ./console
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
        NEXT_PUBLIC_GATEWAY_URL: ${NEXT_PUBLIC_GATEWAY_URL:-http://localhost:8080}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3001}
        NEXT_PUBLIC_AUTHCLAW_DEMO_MODE: "false"
        NEXT_PUBLIC_ENABLE_EXPERIMENTAL_SURFACES: ${NEXT_PUBLIC_ENABLE_EXPERIMENTAL_SURFACES:-false}
    container_name: authclaw-full-console
    depends_on:
      backend:
        condition: service_healthy
      gateway:
        condition: service_started
      agent:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_APP_USER:-authclaw_app}:${POSTGRES_APP_PASSWORD:-authclaw_app}@postgres:5432/${POSTGRES_DB:-authclaw}
      API_URL: http://backend:8000
      GATEWAY_INTERNAL_URL: http://gateway:8080
      AGENT_INTERNAL_URL: http://agent:8001
      AGENT_TIMEOUT_MS: ${AGENT_TIMEOUT_MS:-45000}
      AUTHCLAW_ENV: ${AUTHCLAW_ENV:-local}
      AUTHCLAW_INTERNAL_SERVICE_SECRET: ${AUTHCLAW_INTERNAL_SERVICE_SECRET:-authclaw-full-internal-service-secret-change-me}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
      NEXT_PUBLIC_GATEWAY_URL: ${NEXT_PUBLIC_GATEWAY_URL:-http://localhost:8080}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3001}
      NEXT_PUBLIC_AUTHCLAW_DEMO_MODE: "false"
      NEXT_PUBLIC_ENABLE_EXPERIMENTAL_SURFACES: ${NEXT_PUBLIC_ENABLE_EXPERIMENTAL_SURFACES:-false}
      AUTHCLAW_COOKIE_SECURE: ${AUTHCLAW_COOKIE_SECURE:-true}
      OIDC_BFF_EXCHANGE_SECRET: ${OIDC_BFF_EXCHANGE_SECRET:-}
      AUTHCLAW_OIDC_LOGIN_PAUSED: ${AUTHCLAW_OIDC_LOGIN_PAUSED:-true}
      SESSION_SECRET: ${SESSION_SECRET:-authclaw-full-local-session-secret}
      SESSION_SECRET_V1: ${SESSION_SECRET_V1:-authclaw-full-local-session-secret}
      SESSION_SECRET_V2: ${SESSION_SECRET_V2:-authclaw-full-local-session-secret-v2}
      AUTHCLAW_SESSION_KEY_VERSION: ${AUTHCLAW_SESSION_KEY_VERSION:-v1}
      NODE_ENV: production
    ports:
      - "${CONSOLE_PORT:-3001}:3001"

volumes:
  full_postgres_data:
  full_clickhouse_data:
  full_gateway_audit_outbox:

name: AuthClaw Required CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]
  schedule:
    - cron: '23 2 * * 1'
  workflow_dispatch:
    inputs:
      full_regression:
        description: Run all established CI component regression suites
        type: boolean
        default: true
      arm64:
        description: Also build and smoke-test ARM64 runtime images
        type: boolean
        default: false

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: authclaw-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14.3"
  NODE_VERSION: "22.23.1"
  GO_VERSION_FILE: gateway/go.mod
  REGISTRY: ghcr.io
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  changes:
    name: Detect Changed Components
    if: github.event_name != 'pull_request_review' || github.event.pull_request.base.ref == 'master'
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      audit: ${{ steps.changes.outputs.audit }}
      agent: ${{ steps.changes.outputs.agent }}
      sdk: ${{ steps.changes.outputs.sdk }}
      gateway: ${{ steps.changes.outputs.gateway }}
      console: ${{ steps.changes.outputs.console }}
      terraform: ${{ steps.changes.outputs.terraform }}
      audit_transport: ${{ steps.changes.outputs.audit_transport }}
      shared: ${{ steps.changes.outputs.shared }}
      runtime_images: ${{ steps.changes.outputs.runtime_images }}
      security: ${{ steps.changes.outputs.security }}
      smoke: ${{ steps.changes.outputs.smoke }}
      arm64: ${{ steps.changes.outputs.arm64 }}
      release: ${{ steps.changes.outputs.release }}
      full_regression: ${{ steps.changes.outputs.full_regression }}
      expected_jobs: ${{ steps.changes.outputs.expected_jobs }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 2
      - name: Detect changed components
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          FULL_REGRESSION: ${{ inputs.full_regression }}
          ARM64_ENABLED: ${{ (inputs.arm64 || vars.CI_ARM64_ENABLED == 'true') && 'true' || 'false' }}
          RELEASE_ENABLED: ${{ vars.CONTROLLED_BETA_ENABLED }}
        run: python3 scripts/ci_plan.py

  policy:
    name: Repository Policy
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 2
      - run: |
          git diff --check HEAD^
          python3 -m unittest scripts.test_acl14_delivery_controls scripts.test_repository_policy scripts.ci_plan_test scripts.test_iam_release_evidence scripts.test_verify_p007_edge_evidence scripts.test_p008_private_paths_evidence scripts.test_container_vulnerability_policy scripts.test_ecr_release_control scripts.test_release_evidence scripts.test_ecs_database_job scripts.test_verify_ecs_colocation
      - name: Check repository line budgets
        run: |
          curl --fail --location --silent --show-error https://github.com/XAMPPRocky/tokei/releases/download/v12.1.2/tokei-x86_64-unknown-linux-gnu.tar.gz -o /tmp/tokei.tar.gz
          echo 'c8c5c4ab9e1ff47e745de70f4af3214078657399fa7a0da0b5f209d780e49978  /tmp/tokei.tar.gz' | sha256sum --check
          mkdir -p /tmp/t01-tokei
          tar -xzf /tmp/tokei.tar.gz -C /tmp/t01-tokei
          /tmp/t01-tokei/tokei --files backend/app gateway audit_consumer console/src --output json > /tmp/t01-lines.json
          python3 scripts/check_line_budget.py < /tmp/t01-lines.json
      - name: Validate PR evidence and print growth review marker
        if: github.event.pull_request.number
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 scripts/repository_policy.py --pr-evidence "$PR_NUMBER"
      - name: Verify T01 approval and activation
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/repository_policy.py --verify-github

  smoke:
    name: Master Smoke and Contract Integration
    needs: changes
    if: needs.changes.outputs.smoke == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Validate compose integration and SDK behavior
        run: |
          docker compose --env-file .env.full.example -f docker-compose.full.yml config --quiet
          python -m unittest discover -s sdk/python -p "test_*.py"
      - name: Exercise crypto and audit publisher contracts
        env:
          DATABASE_URL: postgresql+psycopg://test:test@127.0.0.1:1/authclaw_ci_test
          OWNER_DATABASE_URL: postgresql+psycopg://test:test@127.0.0.1:1/authclaw_ci_test
        run: |
          python -m venv .ci-smoke
          .ci-smoke/bin/python -m pip install --require-hashes -r backend/requirements-test.txt
          cd backend
          ../.ci-smoke/bin/python -m pytest -p no:cacheprovider -q tests/test_secret_crypto.py tests/test_audit_transport_contract.py

  security:
    name: Security Scans
    needs: changes
    if: needs.changes.outputs.security == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Scan repository for committed secrets
        run: >-
          docker run --rm -v "${{ github.workspace }}:/repo:ro"
          ghcr.io/gitleaks/gitleaks:v8.24.3
          dir --redact --config=/repo/.gitleaks.toml /repo
      - name: Scan dependencies, secrets, and infrastructure
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"
          format: json
          output: trivy-filesystem.json
          skip-dirs: ".git,.terraform,node_modules,console/node_modules,backend/.venv,audit_consumer/.venv,backend/.pytest_cache,audit_consumer/.pytest_cache"
      - name: Preserve filesystem scan evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: filesystem-scan-evidence-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: trivy-filesystem.json
          if-no-files-found: error
          retention-days: 14

  backend:
    name: Backend Unit Tests
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7.4.7-alpine@sha256:02f2cc4882f8bf87c79a220ac958f58c700bdec0dfb9b9ea61b62fb0e8f1bfcf
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Run backend security and compliance tests
        env:
          DATABASE_URL: postgresql+psycopg://test:test@127.0.0.1:1/authclaw_ci_test
          OWNER_DATABASE_URL: postgresql+psycopg://test:test@127.0.0.1:1/authclaw_ci_test
          REDIS_URL: redis://127.0.0.1:6379
        run: |
          python -m venv .ci-backend
          .ci-backend/bin/python -m pip install --require-hashes -r backend/requirements-test.txt
          cd backend
          ../.ci-backend/bin/python -m pytest -p no:cacheprovider -q \
            tests/test_auth_baseline.py tests/test_mfa_replay.py tests/test_ent022_mfa_security.py tests/test_authorization_matrix.py tests/test_policy_engine.py \
            tests/test_client_ip.py tests/test_bff_client_ip.py tests/test_release4_abuse_controls.py \
            tests/test_oidc_transactions.py \
            tests/test_reset_abuse_security.py tests/test_review_logging_and_event_identity.py \
            tests/test_cloud_security.py tests/test_policy_chat_security.py tests/test_review_audit_security.py \
            tests/test_audit_export.py tests/test_trust_center.py \
            tests/test_worker_hmac.py tests/test_worker_cleanup.py tests/test_ephemeral_workers.py \
            tests/test_migration_chain.py tests/test_migration_044.py tests/test_auth_session_binding_migration.py tests/test_platform_admin_seed.py \
            tests/test_acl19_continuous_evidence.py tests/test_acl25_abuse_privacy_retention.py \
            tests/test_compliance_scoring.py tests/test_migration_038.py tests/test_migration_040.py \
            tests/test_control_assessments.py tests/test_compliance_policy.py tests/test_t10_api_contract.py \
            tests/test_secret_crypto.py tests/test_secret_retirement.py tests/test_audit_transport_contract.py \
            tests/test_s3_remediation_protocol.py tests/test_s3_remediation_recovery.py \
            tests/test_remediation_connector.py tests/test_connector_target_binding.py tests/test_remediation_failure_rollback.py

  backend-integration:
    name: Backend PostgreSQL Integration
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      redis:
        image: redis:7.4.7-alpine@sha256:02f2cc4882f8bf87c79a220ac958f58c700bdec0dfb9b9ea61b62fb0e8f1bfcf
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      postgres:
        image: postgres:16.10-alpine@sha256:029660641a0cfc575b14f336ba448fb8a75fd595d42e1fa316b9fb4378742297
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: authclaw-ci-owner
          POSTGRES_DB: authclaw_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d authclaw_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      BOOTSTRAP_DATABASE_URL: postgresql+psycopg://postgres:authclaw-ci-owner@127.0.0.1:5432/authclaw_ci_test
      REDIS_URL: redis://127.0.0.1:6379
      BACKEND_MIGRATION_DATABASE_URL: postgresql+psycopg://authclaw_migrator:authclaw-ci-migrator@127.0.0.1:5432/authclaw_ci_test
      BACKEND_DATABASE_URL: postgresql+psycopg://authclaw_app:authclaw-ci-app@127.0.0.1:5432/authclaw_ci_test
      OWNER_DATABASE_URL: postgresql+psycopg://postgres:authclaw-ci-owner@127.0.0.1:5432/authclaw_ci_test
      DATABASE_URL: postgresql+psycopg://authclaw_app:authclaw-ci-app@127.0.0.1:5432/authclaw_ci_test
      TEST_OWNER_DATABASE_URL: postgresql+psycopg://postgres:authclaw-ci-owner@127.0.0.1:5432/authclaw_ci_test
      TEST_DATABASE_URL: postgresql+psycopg://authclaw_app:authclaw-ci-app@127.0.0.1:5432/authclaw_ci_test
      POSTGRES_DB: authclaw_ci_test
      BACKEND_MIGRATOR_USER: authclaw_migrator
      BACKEND_MIGRATOR_PASSWORD: authclaw-ci-migrator
      POSTGRES_APP_USER: authclaw_app
      POSTGRES_APP_PASSWORD: authclaw-ci-app
      AGENT_MIGRATOR_USER: authclaw_agent_migrator
      AGENT_MIGRATOR_PASSWORD: authclaw-ci-agent-migrator
      AGENT_RUNTIME_USER: authclaw_agent_runtime
      AGENT_RUNTIME_PASSWORD: authclaw-ci-agent-runtime
      ENVELOPE_KEY: YXV0aGNsYXctY2ktZW52ZWxvcGUta2V5LTMyaA==
      API_KEY_HASH_SECRET: authclaw-ci-api-key-hash-secret
      JWT_SECRET: authclaw-ci-jwt-secret-material-32-bytes
      SESSION_SECRET: authclaw-ci-session-secret-material-32
      AUTHCLAW_ENV: ci
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install backend test dependencies
        run: |
          python -m venv .ci-backend-integration
          .ci-backend-integration/bin/python -m pip install --require-hashes -r backend/requirements-test.txt
      - name: Prepare roles, migrate to head, and finalize grants
        working-directory: backend
        run: |
          ../.ci-backend-integration/bin/python scripts/bootstrap_database_security.py prepare
          DATABASE_URL="$BACKEND_MIGRATION_DATABASE_URL" ../.ci-backend-integration/bin/python -m alembic upgrade head
          ../.ci-backend-integration/bin/python scripts/bootstrap_database_security.py finalize-backend
      - name: Verify auditor OTP concurrency
        working-directory: backend
        env:
          REVIEW_DATABASE_URL: ${{ env.BOOTSTRAP_DATABASE_URL }}
        run: >-
          timeout 120s ../.ci-backend-integration/bin/python -m pytest -p no:cacheprovider -q
          tests/test_review_otp_postgres.py
      - name: Run destructive PostgreSQL suites serially
        working-directory: backend
        run: >-
          ../.ci-backend-integration/bin/python -m pytest -p no:cacheprovider -q
          tests/test_db_safety.py
          tests/test_tenant_isolation.py
          tests/test_endpoints.py
          tests/test_finding_status_migration_postgres.py
          tests/test_notifications.py
          tests/test_onboarding_invitations.py
          tests/test_user_invitation_lifecycle.py
          tests/test_phase10.py
          tests/test_access_requests.py
          tests/test_secret_retirement_postgres.py
          tests/test_worker_lifecycle_postgres.py
          tests/test_workflow_advisory_lock_postgres.py
          tests/test_t10_postgres.py

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.sum
      - name: Verify gateway audit and notifications with authenticated PostgreSQL role
        working-directory: gateway
        run: |
          export DATABASE_URL="${BACKEND_DATABASE_URL/postgresql+psycopg:/postgresql:}"
          export AUDIT_TEST_OWNER_DATABASE_URL="${OWNER_DATABASE_URL/postgresql+psycopg:/postgresql:}"
          export BEDROCK_TEST_OWNER_DATABASE_URL="$AUDIT_TEST_OWNER_DATABASE_URL"
          go test ./... -count=1 -run '^Test(AuditAuthenticatedContextPostgres|BedrockBudgetAuthenticatedPostgres)$'

  audit:
    name: Audit Consumer Tests
    needs: changes
    if: needs.changes.outputs.audit_transport == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: |
          python -m venv .ci-audit
          .ci-audit/bin/python -m pip install --require-hashes -r audit_consumer/requirements-test.txt
          cd audit_consumer
          ../.ci-audit/bin/python -m pytest -p no:cacheprovider tests/ -q
          ../.ci-audit/bin/python local_e2e.py --transport both --evidence ../infra/security/audit-transport-ci-e2e.md
          cd ..
          trap 'docker compose -p authclaw-audit-e2e -f docker-compose.yml -f docker-compose.audit-e2e.yml --profile audit-e2e down --remove-orphans' EXIT
          docker compose -p authclaw-audit-e2e -f docker-compose.yml -f docker-compose.audit-e2e.yml --profile audit-e2e up -d --wait --wait-timeout 120 kafka kafka-init clickhouse localstack
          .ci-audit/bin/python audit_consumer/local_e2e.py --real-adapters --evidence infra/security/audit-transport-ci-real-e2e.md

  agent:
    name: Agent Tests
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.10-alpine@sha256:029660641a0cfc575b14f336ba448fb8a75fd595d42e1fa316b9fb4378742297
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: authclaw-agent-ci-owner
          POSTGRES_DB: authclaw_agent_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d authclaw_agent_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7.4.7-alpine@sha256:02f2cc4882f8bf87c79a220ac958f58c700bdec0dfb9b9ea61b62fb0e8f1bfcf
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      ENT018_REDIS_URL: redis://localhost:6379
      ENT022_AGENT_POSTGRES_URL: postgresql+psycopg2://postgres:authclaw-agent-ci-owner@127.0.0.1:5432/authclaw_agent_ci_test
      QUOTA_TEST_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: |
          python -m venv .ci-agent
          .ci-agent/bin/python -m pip install --require-hashes \
            -r services/agent/requirements.txt -r services/agent/requirements-model.txt \
            -r services/agent/requirements-test.txt
          .ci-agent/bin/python -m compileall -q services/agent
          cd services/agent
          ../../.ci-agent/bin/python -m pytest --noconftest -p no:cacheprovider \
            tests/test_sensitive_data_detection.py tests/test_audit_transport_contract.py \
            smoke_tests/test_control_plane_auth.py smoke_tests/test_agent_execution_authorization.py \
            smoke_tests/test_control_plane_mfa_postgres.py \
            smoke_tests/test_graph_security_decisions.py smoke_tests/test_graph_metadata_contract.py \
            smoke_tests/test_quota_service.py smoke_tests/test_quota_http_boundary.py \
            smoke_tests/test_provider_quotas.py smoke_tests/test_monitoring_quotas.py \
            smoke_tests/test_quota_redis.py smoke_tests/test_compliance_diagnostics.py -q
      - name: Verify real backend TOTP through signed agent approval and execution
        env:
          ENT022_EVIDENCE_DIR: ${{ github.workspace }}/ent022-mfa-evidence
          TEST_OWNER_DATABASE_URL: postgresql+psycopg://postgres:authclaw-agent-ci-owner@127.0.0.1:5432/authclaw_agent_ci_test
          OWNER_DATABASE_URL: postgresql+psycopg://postgres:authclaw-agent-ci-owner@127.0.0.1:5432/authclaw_agent_ci_test
          TEST_DATABASE_URL: postgresql+psycopg://authclaw_app:authclaw-ci-app@127.0.0.1:5432/authclaw_agent_ci_test
          DATABASE_URL: postgresql+psycopg://authclaw_app:authclaw-ci-app@127.0.0.1:5432/authclaw_agent_ci_test
          BACKEND_MIGRATION_DATABASE_URL: postgresql+psycopg://authclaw_migrator:authclaw-ci-migrator@127.0.0.1:5432/authclaw_agent_ci_test
          BACKEND_MIGRATOR_PASSWORD: authclaw-ci-migrator
          POSTGRES_APP_PASSWORD: authclaw-ci-app
          REDIS_URL: redis://localhost:6379
          ENVELOPE_KEY: YXV0aGNsYXctY2ktZW52ZWxvcGUta2V5LTMyaA==
          API_KEY_HASH_SECRET: authclaw-ci-api-key-hash-secret
          SESSION_SECRET: authclaw-ci-session-secret-material-32
          AUTHCLAW_ENV: test
        run: |
          python -m venv .ci-mfa-backend
          .ci-mfa-backend/bin/python -m pip install --require-hashes -r backend/requirements-test.txt
          export ENT022_AGENT_PYTHON="$PWD/.ci-agent/bin/python"
          cd backend
          ../.ci-mfa-backend/bin/python -m pytest -p no:cacheprovider tests/test_agent_mfa_assertion_postgres.py -q
      - name: Preserve privileged MFA audit evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ent022-mfa-evidence-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ent022-mfa-evidence/*.json
          if-no-files-found: error
          retention-days: 14

  sdk:
    name: Python SDK Tests
    needs: changes
    if: needs.changes.outputs.sdk == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m unittest discover -s sdk/python -p "test_*.py"

  gateway:
    name: Gateway Tests
    needs: changes
    if: needs.changes.outputs.gateway == 'true'
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4.7-alpine@sha256:02f2cc4882f8bf87c79a220ac958f58c700bdec0dfb9b9ea61b62fb0e8f1bfcf
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache-dependency-path: gateway/go.sum
      - name: Run gateway tests
        working-directory: gateway
        env:
          DATABASE_URL: postgresql://test:test@127.0.0.1:1/authclaw_gateway_ci_test?sslmode=verify-full
          REDIS_URL: redis://127.0.0.1:6379
          QUOTA_REDIS_TEST: "1"
        run: >-
          go test ./... -count=1
          -run '^(TestQuota|TestProviderQuota|TestACL17|TestClientIP|TestAtomicRateLimit|TestSecret|TestProviderSecret|TestRedactionBlindIndex|TestCryptographicRandomHelpers|TestCompatibleDatabaseRevisions|TestDatabaseConfig|TestInitDBRejectsUnsafeSharedDatabaseURL|TestHealthCheck|TestPayloadFidelityContract|TestStreamingPayloadFidelityContracts|TestProviderContractManifestDriftGate|TestValidatePolicyYAMLRejectsInvalidSRSFields|TestEmitAuditEvent_|TestAuditEvent_|TestSQSFIFOAuditStream|TestAuditProducer|TestProviderPrefixesFailClosedBeforeEgress|TestRequiredAuditFailureIsObservableInFailOpenMode|TestStreamingOutcomeFailurePreservesResponseAndWritesRecovery|TestAttemptAndOutcomeUseDistinctDeterministicKeys)'
      - name: Verify quota alert rules
        run: >-
          docker run --rm --entrypoint /bin/promtool
          -v "${{ github.workspace }}/infra/observability:/rules:ro" -w /rules
          prom/prometheus:v3.5.1@sha256:38c3b05c3bc744ff1b0b7b4eb82196026442845e62a1e2073795565da506d7a2
          test rules quota-alerts.test.yml

  console:
    name: Console Tests and Build
    needs: changes
    if: needs.changes.outputs.console == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: console/package-lock.json
      - name: Run lint, tests, typecheck, audit, and build
        working-directory: console
        env:
          API_URL: http://localhost:8000
          NEXT_PUBLIC_GATEWAY_URL: http://localhost:8080
          NEXT_PUBLIC_AUTHCLAW_DEMO_MODE: "true"
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
          NEXT_PUBLIC_ENABLE_EXPERIMENTAL_SURFACES: "true"
          SESSION_SECRET: ci-console-session-secret
        run: |
          npm ci
          npm run lint
          npm run test:unit
          npm audit --audit-level=high
          npx tsc --noEmit --pretty false
          npm run build

  compose:
    name: Compose Contract
    needs: changes
    if: needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: python scripts/test_compose_contract.py

  terraform:
    name: Terraform Validation
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: 1.15.7
      - name: Run Terraform format and validation
        env:
          AWS_ACCESS_KEY_ID: ci-placeholder
          AWS_SECRET_ACCESS_KEY: ci-placeholder
          AWS_EC2_METADATA_DISABLED: "true"
          TF_IN_AUTOMATION: "true"
        run: |
          terraform -chdir=infra/terraform fmt -check -recursive
          terraform -chdir=infra/terraform init -backend=false
          terraform -chdir=infra/terraform validate
          cat > infra/terraform/ci-plan.tfvars.json <<'JSON'
          {
            "environment": "ci",
            "authclaw_env": "ci",
            "ci_skip_aws_validation": true,
            "enable_secondary": false,
            "enable_cross_region_db_replica": false,
            "internal_tls": {"enabled": true, "namespace": "internal.example.com"},
            "primary_availability_zones": ["us-east-1a", "us-east-1b"],
            "quota_alert_sns_topic_arns": {"primary": ["arn:aws:sns:us-east-1:123456789012:authclaw-ci-quota-alerts"]},
            "container_images": {
              "agent": "example.com/authclaw/agent:test",
              "backend": "example.com/authclaw/backend:test",
              "gateway": "example.com/authclaw/gateway:test",
              "console": "example.com/authclaw/console:test",
              "audit_consumer": "example.com/authclaw/audit-consumer:test",
              "opa": "openpolicyagent/opa:test",
              "presidio": "mcr.microsoft.com/presidio-analyzer:test"
            }
          }
          JSON
          terraform -chdir=infra/terraform plan -input=false -lock=false -var-file=ci-plan.tfvars.json -out=kafka.tfplan -var=audit_stream_transport=kafka
          terraform -chdir=infra/terraform show -json kafka.tfplan > infra/terraform/kafka-plan.json
          python scripts/assert_audit_transport_plan.py kafka infra/terraform/kafka-plan.json
          python scripts/assert_quota_observability_plan.py infra/terraform/kafka-plan.json
          terraform -chdir=infra/terraform plan -input=false -lock=false -var-file=ci-plan.tfvars.json -out=sqs.tfplan -var=audit_stream_transport=sqs_fifo
          terraform -chdir=infra/terraform show -json sqs.tfplan > infra/terraform/sqs-plan.json
          python scripts/assert_audit_transport_plan.py sqs_fifo infra/terraform/sqs-plan.json
          if terraform -chdir=infra/terraform plan -input=false -lock=false -var-file=ci-plan.tfvars.json -var=audit_stream_transport=sqs_fifo -var=audit_sqs_require_alarm_actions=true; then
            echo "::error::production sqs_fifo plan must require audit_sqs_alarm_action_arns"
            exit 1
          fi
          terraform -chdir=infra/terraform plan -input=false -lock=false -var-file=ci-plan.tfvars.json -out=sqs-prod.tfplan -var=audit_stream_transport=sqs_fifo -var=audit_sqs_require_alarm_actions=true -var='audit_sqs_alarm_action_arns=["arn:aws:sns:us-east-1:123456789012:authclaw-audit-alerts"]'
          python scripts/sqs_audit_deployment_readiness.py --output-json infra/security/sqs-audit-ci-pending.json --output-md infra/security/sqs-audit-ci-pending.md
          terraform -chdir=infra/terraform test
      - name: Internal TLS and SMTP certificate checks
        run: >-
          docker run --rm --user 0 --mount type=bind,source=${{ github.workspace }},target=/repo,readonly
          --entrypoint sh nginxinc/nginx-unprivileged@sha256:9b87ad3dd9f431c733f19dfb278c7eb3dba9dca381942c79818bb42f1a566a83
          -c 'apk add --no-cache python3 py3-cryptography && su nginx -s /bin/sh -c "python3 /repo/scripts/test_internal_tls.py && python3 /repo/scripts/test_direct_aws.py"'
      - name: Application-container TLS rotation rehearsal
        run: |
          docker build -f backend/Dockerfile.demo -t authclaw-security-backend:local backend
          docker build -t authclaw-security-opa:local infra/opa
          python3 scripts/test_internal_tls_containers.py

  arm64-images:
    name: ARM64 Runtime Images
    needs: changes
    if: needs.changes.outputs.arm64 == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - name: Build and smoke-test ARM64 runtime images
        shell: pwsh
        run: pwsh -NoProfile -File scripts/p0_04_build_smoke.ps1 -Platform linux/arm64 -Service all

  checks:
    name: ACL-14 Required Checks
    if: always() && (github.event_name != 'pull_request_review' || github.event.pull_request.base.ref == 'master')
    needs: [changes, policy, smoke, security, backend, backend-integration, audit, agent, sdk, gateway, console, compose, terraform, arm64-images]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Verify all required jobs
        env:
          EXPECTED_JOBS: ${{ needs.changes.outputs.expected_jobs }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/ci_plan.py verify

  release-images:
    name: Controlled-Beta Release Images
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && vars.CONTROLLED_BETA_ENABLED == 'true' && needs.changes.outputs.release == 'true'
    needs: [changes, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { service: backend, context: ./backend, dockerfile: ./backend/Dockerfile.demo }
          - { service: gateway, context: ./gateway, dockerfile: ./gateway/Dockerfile.demo }
          - { service: console, context: ./console, dockerfile: ./console/Dockerfile }
          - { service: agent, context: ./services/agent, dockerfile: ./services/agent/Dockerfile }
          - { service: audit-consumer, context: ., dockerfile: ./audit_consumer/Dockerfile }
          - { service: opa-bundle, context: ./infra/opa, dockerfile: ./infra/opa/Dockerfile }
          - { service: presidio, context: ./infra/presidio, dockerfile: ./infra/presidio/Dockerfile }
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.0.0
        with:
          image: tonistiigi/binfmt:qemu-v9.2.2@sha256:1b804311fe87047a4c96d38b4b3ef6f62fca8cd125265917a9e3dc3c996c39e6
          platforms: arm64
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      - name: Compute lowercase image name
        id: image
        shell: bash
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          repository="ghcr.io/$repo/${{ matrix.service }}"
          {
            echo "repository=$repository"
            echo "name=$repository:ci-${GITHUB_SHA}"
            echo "quarantine=$repository:quarantine-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          } >> "$GITHUB_OUTPUT"
      - name: Initialize immutable digest evidence
        shell: bash
        run: >-
          jq -n --arg service '${{ matrix.service }}' --arg image '${{ steps.image.outputs.name }}'
          --arg tag "ci-${GITHUB_SHA}" --arg commit "$GITHUB_SHA" --arg timestamp "$(date -u +%FT%TZ)"
          '{service:$service,image_reference:$image,release_tag:$tag,manifest_list_digest:"",linux_amd64_digest:"",linux_arm64_digest:"",source_commit_sha:$commit,timestamp:$timestamp,status:"FAIL"}'
          > release-manifest-evidence.json
      - uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        id: build
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.image.outputs.quarantine }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=ci-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=min,scope=${{ matrix.service }}
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:18000/api/v1
            NEXT_PUBLIC_GATEWAY_URL=http://localhost:18080
            NEXT_PUBLIC_AUTHCLAW_DEMO_MODE=true
      - name: Verify quarantine manifest and capture immutable digests
        id: quarantine
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.quarantine }}
          INDEX_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$INDEX_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          manifest="$(docker buildx imagetools inspect "$IMAGE@$INDEX_DIGEST" --raw)"
          jq -e '(.mediaType == "application/vnd.oci.image.index.v1+json" or .mediaType == "application/vnd.docker.distribution.manifest.list.v2+json") and (.manifests | type == "array")' <<<"$manifest" >/dev/null
          amd64="$(jq -er '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest][0] // empty' <<<"$manifest")"
          arm64="$(jq -er '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64") | .digest][0] // empty' <<<"$manifest")"
          [[ "$amd64" =~ ^sha256:[0-9a-f]{64}$ && "$arm64" =~ ^sha256:[0-9a-f]{64}$ ]]
          {
            echo "index=$INDEX_DIGEST"
            echo "amd64=$amd64"
            echo "arm64=$arm64"
          } >> "$GITHUB_OUTPUT"
      - name: Validate vulnerability policy
        shell: bash
        run: >-
          python3 scripts/container_vulnerability_policy.py
          --service '${{ matrix.service }}' --output .trivyignore.generated
      - name: Scan quarantined AMD64 child
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.repository }}@${{ steps.quarantine.outputs.amd64 }}
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          trivyignores: .trivyignore.generated
          exit-code: "1"
          format: json
          output: trivy-amd64.json
      - name: Scan quarantined ARM64 child
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.repository }}@${{ steps.quarantine.outputs.arm64 }}
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          trivyignores: .trivyignore.generated
          exit-code: "1"
          format: json
          output: trivy-arm64.json
      - name: Promote and verify release manifest
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          QUARANTINE: ${{ steps.image.outputs.quarantine }}
          QUARANTINE_INDEX: ${{ steps.quarantine.outputs.index }}
          AMD64: ${{ steps.quarantine.outputs.amd64 }}
          ARM64: ${{ steps.quarantine.outputs.arm64 }}
        run: |
          set -euo pipefail
          docker buildx imagetools create --tag "$IMAGE" "$QUARANTINE@$QUARANTINE_INDEX"
          index="$(docker buildx imagetools inspect "$IMAGE" --format '{{json .Manifest}}' | jq -er '.digest')"
          [[ "$index" =~ ^sha256:[0-9a-f]{64}$ ]]
          manifest="$(docker buildx imagetools inspect "$IMAGE@$index" --raw)"
          jq -e '(.mediaType == "application/vnd.oci.image.index.v1+json" or .mediaType == "application/vnd.docker.distribution.manifest.list.v2+json") and (.manifests | type == "array")' <<<"$manifest" >/dev/null
          amd64="$(jq -er '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest][0] // empty' <<<"$manifest")"
          arm64="$(jq -er '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64") | .digest][0] // empty' <<<"$manifest")"
          [[ "$amd64" == "$AMD64" && "$arm64" == "$ARM64" ]]
          amd64_size="$(docker buildx imagetools inspect "$IMAGE@$amd64" --raw | jq '[.layers[].size] | add')"
          arm64_size="$(docker buildx imagetools inspect "$IMAGE@$arm64" --raw | jq '[.layers[].size] | add')"
          baseline_index="$(docker buildx imagetools inspect "${{ steps.image.outputs.repository }}:size-baseline" --format '{{json .Manifest}}' 2>/dev/null | jq -r '.digest // empty' || true)"
          baseline_amd64_size=0
          baseline_arm64_size=0
          has_baseline=false
          if [[ "$baseline_index" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            baseline_manifest="$(docker buildx imagetools inspect "${{ steps.image.outputs.repository }}@$baseline_index" --raw)"
            baseline_amd64="$(jq -r '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest][0] // empty' <<<"$baseline_manifest")"
            baseline_arm64="$(jq -r '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64") | .digest][0] // empty' <<<"$baseline_manifest")"
            if [[ -n "$baseline_amd64" && -n "$baseline_arm64" ]]; then
              baseline_amd64_size="$(docker buildx imagetools inspect "${{ steps.image.outputs.repository }}@$baseline_amd64" --raw | jq '[.layers[].size] | add')"
              baseline_arm64_size="$(docker buildx imagetools inspect "${{ steps.image.outputs.repository }}@$baseline_arm64" --raw | jq '[.layers[].size] | add')"
              has_baseline=true
            fi
          fi
          jq -n --arg service '${{ matrix.service }}' --arg image "$IMAGE" --arg tag "ci-${GITHUB_SHA}" --arg index "$index" --arg amd64 "$amd64" --arg arm64 "$arm64" --arg commit "$GITHUB_SHA" --arg timestamp "$(date -u +%FT%TZ)" --arg baseline "$baseline_index" --argjson amd64_size "$amd64_size" --argjson arm64_size "$arm64_size" --argjson baseline_amd64_size "$baseline_amd64_size" --argjson baseline_arm64_size "$baseline_arm64_size" --argjson has_baseline "$has_baseline" '{service:$service,image_reference:$image,release_tag:$tag,manifest_list_digest:$index,linux_amd64_digest:$amd64,linux_arm64_digest:$arm64,source_commit_sha:$commit,timestamp:$timestamp,sizes:{linux_amd64_bytes:$amd64_size,linux_arm64_bytes:$arm64_size,baseline_digest:(if $baseline == "" then null else $baseline end),linux_amd64_change_bytes:(if $has_baseline then $amd64_size-$baseline_amd64_size else null end),linux_arm64_change_bytes:(if $has_baseline then $arm64_size-$baseline_arm64_size else null end)},status:"PASS"}' > release-manifest-evidence.json
          docker buildx imagetools inspect "$IMAGE@$index" --format '{{json .SBOM}}' > sbom.json
          docker buildx imagetools inspect "$IMAGE@$index" --format '{{json .Provenance}}' > provenance.json
          jq -e 'type == "object"' sbom.json provenance.json >/dev/null
          cosign sign --yes "$IMAGE@$index"
          cosign verify --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/ci.yml@refs/heads/master" --certificate-oidc-issuer "https://token.actions.githubusercontent.com" "$IMAGE@$index" > signature-verification.json
          docker buildx imagetools create --tag "${{ steps.image.outputs.repository }}:size-baseline" "$IMAGE@$index"
      - name: Preserve immutable digest evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-manifest-evidence-${{ github.sha }}-${{ matrix.service }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release-manifest-evidence.json
            trivy-amd64.json
            trivy-arm64.json
            sbom.json
            provenance.json
            signature-verification.json
          if-no-files-found: error
          retention-days: 14
  release-status:
    name: Release Completion Gate
    if: always()
    needs: [changes, checks, release-images]
    runs-on: ubuntu-latest
    steps:
      - name: Reject incomplete enabled releases
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          RELEASE_EXPECTED: ${{ needs.changes.outputs.release }}
          RELEASE_RESULT: ${{ needs.release-images.result }}
        run: |
          test "$CHANGES_RESULT" = success
          test "$CHECKS_RESULT" = success
          if [ "$RELEASE_EXPECTED" = true ]; then
            test "$RELEASE_RESULT" = success
          else
            test "$RELEASE_RESULT" = skipped
          fi

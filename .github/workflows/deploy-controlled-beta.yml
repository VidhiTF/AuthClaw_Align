name: Deploy Controlled Beta

on:
  workflow_run:
    workflows: ["AuthClaw Required CI"]
    branches: [master]
    types: [completed]

permissions:
  actions: read
  contents: read
  id-token: write
  packages: read

concurrency:
  group: authclaw-controlled-beta
  cancel-in-progress: false

jobs:
  eligibility:
    name: Verify source release completion
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master' &&
      vars.CONTROLLED_BETA_ENABLED == 'true'
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.release.outputs.ready }}
    steps:
      - name: Require all scanned release images from the triggering run
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPOSITORY/actions/runs/$RUN_ID/jobs?filter=latest&per_page=100" \
            --jq '.jobs[]' | jq -s '.' > source-jobs.json
          count="$(jq '[.[] | select(.name | startswith("Controlled-Beta Release Images")) | select(.conclusion != "skipped")] | length' source-jobs.json)"
          if [[ "$count" == 0 ]]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          jq -e '([.[] | select(.name | startswith("Controlled-Beta Release Images"))] | length) == 7 and
            all(.[] | select(.name | startswith("Controlled-Beta Release Images")); .conclusion == "success") and
            any(.[]; .name == "Release Completion Gate" and .conclusion == "success") and
            any(.[]; .name == "ACL-14 Required Checks" and .conclusion == "success")' source-jobs.json >/dev/null
          echo 'ready=true' >> "$GITHUB_OUTPUT"

  deploy:
    name: Immutable Controlled-Beta Deployment
    needs: eligibility
    if: needs.eligibility.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: controlled-beta
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      BETA_CERTIFICATE_ARN: ${{ vars.BETA_CERTIFICATE_ARN }}
      BETA_DOMAIN_NAME: ${{ vars.BETA_DOMAIN_NAME }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      ROLLBACK_PROTECTED_UNTIL: ${{ vars.ROLLBACK_PROTECTED_UNTIL }}
      DATABASE_COMPATIBLE_UNTIL: ${{ vars.DATABASE_COMPATIBLE_UNTIL }}
      DEEP_ROLLBACK_INVENTORY_JSON: ${{ vars.DEEP_ROLLBACK_INVENTORY_JSON }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_KEY: ${{ vars.TF_STATE_KEY }}
      TF_STATE_KMS_KEY_ID: ${{ vars.TF_STATE_KMS_KEY_ID }}
      TF_VAR_certificate_arn: ${{ vars.BETA_CERTIFICATE_ARN }}
      TF_VAR_domain_name: ${{ vars.BETA_DOMAIN_NAME }}
      TF_VAR_primary_certificate_arn: ${{ vars.BETA_CERTIFICATE_ARN }}
      TF_VAR_primary_region: ${{ vars.AWS_REGION }}
      TF_VAR_enable_policy_sidecar_colocation: ${{ vars.ENABLE_POLICY_SIDECAR_COLOCATION || 'false' }}
      TF_VAR_service_cpu_architectures: ${{ vars.SERVICE_CPU_ARCHITECTURES_JSON || '{}' }}
      TF_VAR_audit_stream_transport: ${{ vars.AUDIT_STREAM_TRANSPORT || 'kafka' }}
      TF_VAR_enable_audit_consumer: ${{ vars.ENABLE_AUDIT_CONSUMER || 'false' }}
      TF_VAR_clickhouse_host: ${{ vars.CLICKHOUSE_HOST }}
      TF_VAR_audit_sqs_alarm_action_arns: ${{ vars.AUDIT_SQS_ALARM_ACTION_ARNS_JSON || '[]' }}
      TF_VAR_edge_alarm_action_arns: ${{ vars.EDGE_ALARM_ACTION_ARNS_JSON || '[]' }}
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Require controlled-beta configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in AWS_REGION AWS_ROLE_ARN BETA_CERTIFICATE_ARN BETA_DOMAIN_NAME TF_STATE_BUCKET TF_STATE_KMS_KEY_ID ROLLBACK_PROTECTED_UNTIL DATABASE_COMPATIBLE_UNTIL DEEP_ROLLBACK_INVENTORY_JSON; do
            [[ -n "${!name}" ]] || { echo "::error::Missing controlled-beta variable ${name}"; exit 1; }
          done
          date -d "$ROLLBACK_PROTECTED_UNTIL" >/dev/null
          date -d "$DATABASE_COMPATIBLE_UNTIL" >/dev/null
          jq -e '.services | type == "array"' <<<"$DEEP_ROLLBACK_INVENTORY_JSON" >/dev/null
          [[ "$TF_VAR_enable_policy_sidecar_colocation" == true || "$TF_VAR_enable_policy_sidecar_colocation" == false ]] ||
            { echo '::error::ENABLE_POLICY_SIDECAR_COLOCATION must be true or false'; exit 1; }
          jq -e 'type == "object" and all(.[]; . == "ARM64" or . == "X86_64")' <<<"$TF_VAR_service_cpu_architectures" >/dev/null ||
            { echo '::error::SERVICE_CPU_ARCHITECTURES_JSON must map services to ARM64 or X86_64'; exit 1; }
          [[ "$TF_VAR_audit_stream_transport" == kafka || "$TF_VAR_audit_stream_transport" == sqs_fifo ]] ||
            { echo '::error::AUDIT_STREAM_TRANSPORT must be kafka or sqs_fifo'; exit 1; }
          [[ "$TF_VAR_enable_audit_consumer" == true || "$TF_VAR_enable_audit_consumer" == false ]] ||
            { echo '::error::ENABLE_AUDIT_CONSUMER must be true or false'; exit 1; }
          jq -e 'type == "array" and all(.[]; type == "string")' <<<"$TF_VAR_audit_sqs_alarm_action_arns" >/dev/null ||
            { echo '::error::AUDIT_SQS_ALARM_ACTION_ARNS_JSON must be a JSON string array'; exit 1; }
          jq -e 'type == "array" and length > 0 and all(.[]; type == "string" and startswith("arn:"))' <<<"$TF_VAR_edge_alarm_action_arns" >/dev/null ||
            { echo '::error::EDGE_ALARM_ACTION_ARNS_JSON must contain at least one alarm destination ARN'; exit 1; }
          [[ "$TF_VAR_enable_audit_consumer" != true || -n "$TF_VAR_clickhouse_host" ]] ||
            { echo '::error::CLICKHOUSE_HOST is required when the audit consumer is enabled'; exit 1; }

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: authclaw-acl-14

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: 1.15.7
          terraform_wrapper: false

      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Initialize KMS-encrypted remote state
        shell: bash
        run: |
          printf 'terraform {\n  backend "s3" {}\n}\n' > infra/terraform/backend.generated.tf
          terraform -chdir=infra/terraform init -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=${TF_STATE_KEY:-authclaw/controlled-beta.tfstate}" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="encrypt=true" \
            -backend-config="kms_key_id=$TF_STATE_KMS_KEY_ID" \
            -backend-config="use_lockfile=true"

      - name: Create encrypted immutable registries
        shell: bash
        run: |
          jq -n '{
            environment: "controlled-beta",
            authclaw_env: "ci",
            enable_secondary: false,
            require_immutable_images: false,
            container_images: {
              agent: "bootstrap.invalid/agent:unused",
              backend: "bootstrap.invalid/backend:unused",
              gateway: "bootstrap.invalid/gateway:unused",
              console: "bootstrap.invalid/console:unused",
              audit_consumer: "bootstrap.invalid/audit-consumer:unused",
              opa: "bootstrap.invalid/opa:unused",
              presidio: "bootstrap.invalid/presidio:unused"
            },
            tags: {Environment: "controlled-beta", Jira: "ACL-14"}
          }' > infra/terraform/beta.auto.tfvars.json
          terraform -chdir=infra/terraform apply -input=false -auto-approve \
            -target=aws_ecr_repository.service

      - name: Log in to GHCR
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote scanned images into encrypted ECR by digest
        shell: bash
        run: |
          set -euo pipefail
          repositories="$(terraform -chdir=infra/terraform output -json ecr_repository_urls)"
          registry="$(jq -r '.backend' <<<"$repositories" | cut -d/ -f1)"
          aws ecr get-login-password --region "$AWS_REGION" |
            docker login --username AWS --password-stdin "$registry"
          repo="${GITHUB_REPOSITORY,,}"

          promote() {
            local key="$1" source="$2" destination repository source_digest digest source_manifest manifest
            destination="$(jq -r --arg key "$key" '.[$key]' <<<"$repositories")"
            repository="${destination#*/}"
            source_digest="$(docker buildx imagetools inspect "$source" --format '{{json .Manifest}}' | jq -er '.digest')"
            cosign verify \
              --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/ci.yml@refs/heads/master" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "${source%:*}@$source_digest" >/dev/null
            source_manifest="$(docker buildx imagetools inspect "${source%:*}@$source_digest" --raw)"
            digest="$(aws ecr describe-images --repository-name "$repository" \
              --image-ids imageTag="candidate-$SOURCE_SHA" --query 'imageDetails[0].imageDigest' \
              --output text 2>/dev/null || true)"
            if [[ -z "$digest" || "$digest" == "None" ]]; then
              docker buildx imagetools create --tag "$destination:candidate-$SOURCE_SHA" "${source%:*}@$source_digest"
              digest="$(aws ecr describe-images --repository-name "$repository" \
                --image-ids imageTag="candidate-$SOURCE_SHA" --query 'imageDetails[0].imageDigest' --output text)"
            fi
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            manifest="$(docker buildx imagetools inspect "$destination@$digest" --raw)"
            jq -e '([.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64")] | length) == 1 and ([.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64")] | length) == 1' <<<"$manifest" >/dev/null
            [[ "$(jq -c '[.manifests[] | select(.platform.os == "linux" and (.platform.architecture == "amd64" or .platform.architecture == "arm64")) | [.platform.architecture,.digest]] | sort' <<<"$manifest")" == "$(jq -c '[.manifests[] | select(.platform.os == "linux" and (.platform.architecture == "amd64" or .platform.architecture == "arm64")) | [.platform.architecture,.digest]] | sort' <<<"$source_manifest")" ]]
            printf '%s@%s' "$destination" "$digest"
          }

          agent="$(promote agent "ghcr.io/$repo/agent:ci-$SOURCE_SHA")"
          backend="$(promote backend "ghcr.io/$repo/backend:ci-$SOURCE_SHA")"
          gateway="$(promote gateway "ghcr.io/$repo/gateway:ci-$SOURCE_SHA")"
          console="$(promote console "ghcr.io/$repo/console:ci-$SOURCE_SHA")"
          audit_consumer="$(promote audit-consumer "ghcr.io/$repo/audit-consumer:ci-$SOURCE_SHA")"
          opa="$(promote opa-bundle "ghcr.io/$repo/opa-bundle:ci-$SOURCE_SHA")"
          presidio="$(promote presidio "ghcr.io/$repo/presidio:ci-$SOURCE_SHA")"

          jq -n \
            --arg agent "$agent" --arg backend "$backend" --arg gateway "$gateway" --arg console "$console" \
            --arg audit_consumer "$audit_consumer" --arg opa "$opa" --arg presidio "$presidio" \
            '{
              environment: "controlled-beta",
              authclaw_env: "staging",
              desired_count_primary: 1,
              enable_secondary: false,
              require_immutable_images: true,
              container_images: {
                agent: $agent,
                backend: $backend,
                gateway: $gateway,
                console: $console,
                audit_consumer: $audit_consumer,
                opa: $opa,
                presidio: $presidio
              },
              tags: {Environment: "controlled-beta", Jira: "ACL-14", Release: $ENV.SOURCE_SHA}
            }' > infra/terraform/beta.auto.tfvars.json

      - name: Capture rollback task definitions
        shell: bash
        run: |
          set -euo pipefail
          cluster="authclaw-controlled-beta-primary-cluster"
          : > previous-task-definitions.tsv
          if [[ "$(aws ecs describe-clusters --clusters "$cluster" \
            --query "clusters[?status=='ACTIVE'].clusterName" --output text)" == "$cluster" ]]; then
            aws ecs list-services --cluster "$cluster" --query 'serviceArns[]' --output text |
              tr '\t' '\n' |
              while read -r service_arn; do
                [[ -n "$service_arn" ]] || continue
                service="${service_arn##*/}"
                task_definition="$(aws ecs describe-services --cluster "$cluster" --services "$service" \
                  --query 'services[0].taskDefinition' --output text)"
                printf '%s\t%s\n' "$service" "$task_definition" >> previous-task-definitions.tsv
              done
            python3 scripts/ecr_release_control.py inventory --cluster "$cluster" --output deployed-image-inventory.json
          else
            jq -n '{captured_at:(now|todate),services:[]}' > deployed-image-inventory.json
          fi
          printf '%s' "$DEEP_ROLLBACK_INVENTORY_JSON" > deeper-rollback-inventory.json

      - name: Sign, scan, and verify promoted image digests
        shell: bash
        run: |
          set -euo pipefail
          while read -r image; do cosign sign --yes "$image"; done < <(jq -r '.container_images[]' infra/terraform/beta.auto.tfvars.json)
          python3 scripts/ecr_release_control.py verify \
            --tfvars infra/terraform/beta.auto.tfvars.json \
            --identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/deploy-controlled-beta.yml@refs/heads/master" \
            --output promoted-image-verification.json

      - name: Protect release and rollback digests
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ecr_release_control.py protect \
            --tfvars infra/terraform/beta.auto.tfvars.json \
            --inventory deployed-image-inventory.json \
            --additional-inventory deeper-rollback-inventory.json \
            --release-id "$SOURCE_SHA" \
            --rollback-until "$ROLLBACK_PROTECTED_UNTIL" \
            --database-compatible-until "$DATABASE_COMPATIBLE_UNTIL" \
            --output promotion-record.json

      - name: Preview rollback-safe lifecycle policy
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=infra/terraform output -json ecr_repository_urls > ecr-repositories.json
          python3 scripts/ecr_release_control.py preview \
            --repositories ecr-repositories.json \
            --policy infra/ecr-lifecycle-policy.json \
            --inventory deployed-image-inventory.json \
            --output lifecycle-preview.json

      - name: Gate runtime rollout on complete ciphertext and key inventory
        shell: bash
        env:
          IAM_SECRETS_MIGRATION_APPROVED: ${{ vars.IAM_SECRETS_MIGRATION_APPROVED }}
          BOOTSTRAP_DATABASE_APPROVED: ${{ vars.BOOTSTRAP_DATABASE_APPROVED }}
          DATABASE_EXPAND_COMPATIBILITY_APPROVED: ${{ vars.DATABASE_EXPAND_COMPATIBILITY_APPROVED }}
        run: |
          set -euo pipefail
          [[ "$IAM_SECRETS_MIGRATION_APPROVED" == true ]] ||
            { echo '::error::Approve the secret/RDS/IAM migration and rollback runbook before deployment'; exit 1; }
          # Provision database jobs and their dependencies, never runtime services.
          # Only an empty installation may bootstrap automatically. Existing
          # databases must already satisfy the retirement preconditions.
          terraform -chdir=infra/terraform state list > preflight-state.txt
          fresh=false
          if ! grep -q '^module.primary.aws_db_instance.postgres_primary' preflight-state.txt; then
            [[ ! -s previous-task-definitions.tsv ]] || { echo '::error::Runtime exists without managed database state'; exit 1; }
            fresh=true
          fi
          if [[ ! -s previous-task-definitions.tsv && "$BOOTSTRAP_DATABASE_APPROVED" == true ]]; then
            fresh=true
          fi
          terraform -chdir=infra/terraform apply -input=false -auto-approve \
            -target=module.primary.aws_ecs_cluster.main \
            -target=module.primary.aws_ecs_cluster_capacity_providers.main \
            -target=module.primary.aws_db_instance.postgres_primary \
            -target=module.primary.aws_kms_key_policy.main \
            -target=module.primary.aws_ecs_task_definition.database_job \
            -target=module.primary.aws_subnet.private \
            -target=module.primary.aws_security_group.app \
            -target=module.primary.aws_route.public_internet \
            -target=module.primary.aws_route.private_nat \
            -target=module.primary.aws_route_table_association.public \
            -target=module.primary.aws_route_table_association.private \
            -target=module.primary.aws_iam_role_policy.task_execution
          mapfile -t secrets < <(terraform -chdir=infra/terraform output -json required_secret_arns | jq -er '.[]')
          [[ ${#secrets[@]} -gt 0 ]] || { echo '::error::Secret inventory is unavailable'; exit 1; }
          for secret in "${secrets[@]}"; do
            aws secretsmanager describe-secret --secret-id "$secret" --output json |
              jq -e '[.VersionIdsToStages[]? | select(index("AWSCURRENT"))] | length == 1' >/dev/null ||
              { echo '::error::External secret provisioning is incomplete; runtime rollout stopped'; exit 1; }
          done
          gate="$(terraform -chdir=infra/terraform output -json crypto_preflight)"
          printf '%s' "$gate" > database-gate.json
          run_job() {
            python3 scripts/ecs_database_job.py database-gate.json "$1" --output "database-${1}-task.json"
          }
          if [[ "$fresh" == true ]]; then
            for job in bootstrap_prepare backend_migrations agent_migrations bootstrap_finalize database_security_check; do
              run_job "$job"
            done
          else
            # Expand-only changes must preserve the retained application digest.
            [[ "$DATABASE_EXPAND_COMPATIBILITY_APPROVED" == true ]] ||
              { echo '::error::Previous digest/schema compatibility must be verified before migration'; exit 1; }
            for job in backend_migrations agent_migrations database_security_check; do
              run_job "$job"
            done
          fi
          run_job crypto_preflight
          run_job worker_preflight

      - name: Apply controlled-beta infrastructure and immutable release
        id: runtime_release
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -f infra/terraform/runtime.tfplan' EXIT
          terraform -chdir=infra/terraform plan -input=false -out=runtime.tfplan >/dev/null
          terraform -chdir=infra/terraform show -json runtime.tfplan |
            python scripts/iam_release_evidence.py --access-analyzer > iam-review.json
          echo 'apply_started=true' >> "$GITHUB_OUTPUT"
          terraform -chdir=infra/terraform apply -input=false runtime.tfplan

      - name: Wait for services and verify public health
        shell: bash
        run: |
          set -euo pipefail
          primary="$(terraform -chdir=infra/terraform output -json primary)"
          cluster="$(jq -r '.ecs_cluster_name' <<<"$primary")"
          mapfile -t services < <(jq -r '.ecs_service_names[]' <<<"$primary")
          aws ecs wait services-stable --cluster "$cluster" --services "${services[@]}"
          # Stability can mean the circuit breaker restored the previous release.
          terraform -chdir=infra/terraform show -json | jq -r '
            .values.root_module | .. | objects | select(.type? == "aws_ecs_service") |
            .values | [.name, .task_definition] | @tsv' > target-task-definitions.tsv
          [[ -s target-task-definitions.tsv ]]
          while IFS=$'\t' read -r service definition; do
            aws ecs describe-services --cluster "$cluster" --services "$service" |
              jq -e --arg definition "$definition" '(.failures | length) == 0 and
                (.services | length) == 1 and .services[0].taskDefinition == $definition and
                any(.services[0].deployments[]; .status == "PRIMARY" and
                  .taskDefinition == $definition and .rolloutState == "COMPLETED")' >/dev/null
          done < target-task-definitions.tsv
          while read -r endpoint; do
            curl --fail --silent --show-error --retry 5 --retry-all-errors "$endpoint" >/dev/null
          done < <(jq -r '.public_endpoints[]' <<<"$primary")

      - name: Reject active deployment alarms
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t alarms < <(terraform -chdir=infra/terraform output -json primary | jq -r '.alarm_names[]')
          active="$(aws cloudwatch describe-alarms --alarm-names "${alarms[@]}" \
            --query "MetricAlarms[?StateValue=='ALARM'].AlarmName" --output text)"
          [[ -z "$active" ]] || { echo "::error::Active alarms: $active"; exit 1; }

      - name: Capture and verify deployed policy topology
        shell: bash
        run: |
          set -euo pipefail
          cluster="$(terraform -chdir=infra/terraform output -json primary | jq -er '.ecs_cluster_name')"
          aws ecs list-services --cluster "$cluster" > ecs-services.json
          if [[ "$TF_VAR_enable_policy_sidecar_colocation" == true ]]; then
            for component in gateway backend agent; do
              definition=""
              while IFS=$'\t' read -r service candidate; do
                if [[ "$service" == *-"$component" ]]; then
                  [[ -z "$definition" ]] || { echo "::error::Multiple $component services found"; exit 1; }
                  definition="$candidate"
                fi
              done < target-task-definitions.tsv
              [[ -n "$definition" ]] || { echo "::error::Missing $component task definition"; exit 1; }
              aws ecs describe-task-definition --task-definition "$definition" > "$component-task-definition.json"
            done
            python3 scripts/verify_ecs_colocation.py \
              --gateway gateway-task-definition.json \
              --backend backend-task-definition.json \
              --agent agent-task-definition.json \
              --services ecs-services.json \
              --architecture-map "$TF_VAR_service_cpu_architectures" \
              > colocation-verification.json
          else
            jq -n '{status:"NOT_APPLICABLE",reason:"policy sidecar co-location is disabled for this release"}' \
              > colocation-verification.json
          fi

      - name: Record deployment evidence
        if: always()
        shell: bash
        run: |
          if terraform -chdir=infra/terraform output -json primary > primary-output.json 2>/dev/null; then
            python3 scripts/ecr_release_control.py inventory \
              --cluster "$(jq -er '.ecs_cluster_name' primary-output.json)" --output target-image-inventory.json
            jq --arg sha "$SOURCE_SHA" '{
              source_sha: $sha,
              region,
              alb_dns_name,
              ecs_cluster_name,
              ecs_service_names,
              public_endpoints,
              kms_key_arn,
              alarm_names
            }' primary-output.json > deployment-evidence.json
          fi

      - name: Roll back to previous task definitions
        # Do not restart services after a failed preflight, or restore a
        # CBC-capable image after retirement. The operator must approve the
        # retained rollback image as strict AES-GCM-only before enabling this.
        if: >-
          failure() &&
          steps.runtime_release.outputs.apply_started == 'true' &&
          (steps.runtime_release.outcome == 'success' || steps.runtime_release.outcome == 'failure') &&
          vars.CRYPTO_STRICT_ROLLBACK_APPROVED == 'true'
        shell: bash
        run: |
          [[ -s previous-task-definitions.tsv ]] || exit 0
          cluster="authclaw-controlled-beta-primary-cluster"
          while IFS=$'\t' read -r service task_definition; do
            aws ecs update-service --cluster "$cluster" --service "$service" \
              --task-definition "$task_definition" --force-new-deployment >/dev/null
          done < previous-task-definitions.tsv
          mapfile -t services < <(cut -f1 previous-task-definitions.tsv)
          aws ecs wait services-stable --cluster "$cluster" --services "${services[@]}"
          python3 scripts/ecr_release_control.py inventory --cluster "$cluster" --output rollback-image-inventory.json

      - name: Upload deployment and rollback evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:

services:
  kafka:
    container_name: authclaw-audit-e2e-kafka
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=1G
      - --default-log-level=info
      - --kafka-addr=INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      - --advertise-kafka-addr=INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      - --pandaproxy-addr=0.0.0.0:8082
      - --advertise-pandaproxy-addr=localhost:8082
    ports:
      - "8082:8082"

  kafka-init:
    container_name: authclaw-audit-e2e-kafka-init

  clickhouse:
    container_name: authclaw-audit-e2e-clickhouse
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user authclaw --password authclaw --query 'SELECT 1'"]
      interval: 2s
      timeout: 2s
      retries: 45
      start_period: 5s

  localstack:
    image: localstack/localstack:3.8
    container_name: authclaw-audit-e2e-localstack
    profiles:
      - audit-e2e
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
      SQS_ENDPOINT_STRATEGY: path
    ports:
      - "4566:4566"
